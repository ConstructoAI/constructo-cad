name: Bundle web Constructo (/cad)

# Bâtit le bundle WebAssembly servi par l'ERP sous `app.constructoai.ca/cad/`.
#
# POURQUOI ICI ET PAS DANS LE BUILD RENDER : compiler 425 000 lignes de Rust
# (iced + wgpu + cadkernel) prend des dizaines de minutes et exige la chaîne
# rustup/trunk/wasm-bindgen. Le build Render de l'ERP est Node + Python et doit
# le rester ; il descendra l'artefact produit ici au lieu de le recompiler.
#
# `--public-url /cad/` est ce qui distingue ce build de celui de l'amont
# (`/app/`) : c'est le préfixe sous lequel `erp_api.py` sert les fichiers.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: constructo-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # `build.rs` mesure la distance au dernier tag pour étiqueter la
          # version ; un clone superficiel la remplacerait par `+g<hash>`.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Installer trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # wasm-bindgen refuse de tourner si sa version diffère de celle de la
      # crate compilée dans le binaire : on lit la version depuis Cargo.lock.
      - name: Lire la version de wasm-bindgen
        id: wasm_bindgen
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Installer wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm_bindgen.outputs.version }}

      - name: Bâtir le bundle sous /cad/
        run: |
          debut=$(date +%s)
          trunk build --locked --release \
            --public-url /cad/ \
            --dist dist/cad \
            --html-output index.html \
            web-app.html
          echo "Build wasm : $(( $(date +%s) - debut )) s" >> "$GITHUB_STEP_SUMMARY"

      # La compression se fait ICI, jamais dans le build Render ni à la volée :
      # l'ERP n'a aucun middleware de compression, et recompresser 45 Mo à chaque
      # requête coûterait plus cher que de les envoyer. Le backend sert le `.br`
      # ou le `.gz` selon `Accept-Encoding` (cf. `serve_cad` dans `erp_api.py`).
      #
      # `-q 9` et non `-q 11` : sur un `.wasm` de cette taille, les deux derniers
      # crans coûtent des minutes de CI pour quelques pourcents. On mesure les
      # deux tailles ci-dessous plutôt que de l'affirmer.
      # Servir ce bundle à un client EST une distribution au sens de la GPL-3.0 :
      # la licence doit voyager AVEC lui, et le client doit pouvoir atteindre les
      # sources correspondantes. Sans ces fichiers, l'obligation n'est tenue
      # nulle part — le banc `test_cad_service.py` le vérifie côté ERP.
      - name: Joindre la licence au bundle
        run: |
          cp LICENSE dist/cad/LICENSE
          cp NOTICE-CONSTRUCTO.md dist/cad/NOTICE.txt
          {
            echo "Open CAD Studio — GNU General Public License v3.0"
            echo ""
            echo "Sources amont : https://github.com/HakanSeven12/OpenCADStudio"
            echo "Fork servi ici : https://github.com/ConstructoAI/constructo-cad"
            echo "Revision       : ${GITHUB_SHA}"
            echo ""
            echo "Le texte complet de la licence est dans LICENSE, a cote de ce fichier."
          } > dist/cad/SOURCES.txt

      - name: Précompresser le bundle
        run: |
          command -v brotli >/dev/null || sudo apt-get install -y -qq brotli
          debut=$(date +%s)
          # Seuls les types réellement compressibles : compresser un PNG ajoute
          # un fichier plus gros que l'original, que le client téléchargerait.
          # `.ttf` COMPRIS : les 11 polices Noto pèsent 33 Mo et partaient en
          # clair. Mesure du 2026-09-19 : 32,6 Mo non compressés au total, parce
          # que ce `find` les excluait et que la garde ne regardait que la racine.
          find dist/cad -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.json' \
            -o -name '*.html' -o -name '*.css' -o -name '*.svg' -o -name '*.ttf' \) \
            -size +1k -print0 |
          while IFS= read -r -d '' f; do
            brotli -q 9 -f -o "$f.br" "$f"
            gzip -9 -f -k -S .gz "$f"
          done
          echo "Précompression : $(( $(date +%s) - debut )) s" >> "$GITHUB_STEP_SUMMARY"

          # GARDE, PAS COMPTEUR. La version précédente se contentait d'afficher
          # le nombre de variantes : elle a affiché « 0 brotli, 0 gzip » et rendu
          # succès, pendant que le moteur partait en clair — 51 Mo par visiteur.
          # Un compteur que personne ne lit ne garde rien.
          # RECURSIF : le glob `dist/cad/*_bg.wasm` ne voyait que la racine et
          # ratait `worker_pkg/ocs_web_worker_bg.wasm` (4,4 Mo) et les polices.
          manquantes=0
          while IFS= read -r f; do
            test -f "$f.br" || { echo "MANQUE $f.br"; manquantes=$((manquantes+1)); }
            test -f "$f.gz" || { echo "MANQUE $f.gz"; manquantes=$((manquantes+1)); }
          done < <(find dist/cad -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.ttf' \)                      -size +500k ! -name '*.br' ! -name '*.gz')
          test "$manquantes" -eq 0 || { echo "$manquantes precompression(s) manquante(s)"; exit 1; }
          echo "Variantes : $(find dist/cad -name '*.br' | wc -l) brotli, $(find dist/cad -name '*.gz' | wc -l) gzip"

      # Le coût pour le poste d'un client se mesure en octets TRANSFÉRÉS, pas
      # en octets sur le disque : l'ERP servira le bundle compressé.
      - name: Mesurer le bundle
        run: |
          test -f dist/cad/index.html
          taille() { [ -f "$1" ] && numfmt --to=iec "$(stat -c %s "$1")" || echo '—'; }
          {
            echo ""
            echo "| Fichier | Sur disque | brotli | gzip |"
            echo "|---|---:|---:|---:|"
            # Les `.br`/`.gz` ne sont pas listés pour eux-mêmes : ils apparaissent
            # comme colonnes de l'original. Et on ne recompresse rien pour mesurer.
            find dist/cad -type f ! -name '*.br' ! -name '*.gz' | sort | while read -r f; do
              printf '| %s | %s | %s | %s |\n' \
                "${f#dist/cad/}" "$(taille "$f")" "$(taille "$f.br")" "$(taille "$f.gz")"
            done
            echo ""
            echo "**Total sur disque : $(du -sh dist/cad | cut -f1)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cad-web-bundle
          path: dist/cad
          retention-days: 14
          # Le .wasm est déjà mal compressible par le zip d'artefact ; ne pas
          # payer deux fois le temps de compression.
          compression-level: 1

      # 🔴 LA RELEASE EST CE QUE RENDER TELECHARGE, PAS L'ARTEFACT.
      # Un artefact Actions expire (14 jours) et son URL porte un identifiant
      # qui CHANGE a chaque build : `CAD_BUNDLE_URL` y serait un épinglage à
      # usage unique, et le module mourrait en silence à la date d'expiration —
      # `curl -f` échoue, `build.sh` supprime le bundle, le déploiement reste
      # vert. Mesure du 2026-09-19 : `expires_at 2026-10-03`.
      # Un tag MOBILE (`cad-latest`) donne une URL stable dans le temps.
      - name: Publier le bundle en release (URL stable)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && zip -qr ../cad-bundle.zip cad && cd ..
          echo "archive : $(du -h cad-bundle.zip | cut -f1)"
          gh release delete cad-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create cad-latest cad-bundle.zip             --title "Bundle web CAO (dernier build)"             --notes "Bâti depuis ${GITHUB_SHA}. Tag mobile : cette release est remplacée à chaque build de \`main\`. C'est l'URL que \`CAD_BUNDLE_URL\` doit viser."             --latest=false
          echo "Release cad-latest publiée." >> "$GITHUB_STEP_SUMMARY"
